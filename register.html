<!DOCTYPE html>
<html>
<head>
    <title>Register - Outfitly</title>
</head>

<body bgcolor="black">

<center>

    <br><br>

    <h1><font color="white">OUTFITLY</font></h1>
    <p><font color="lightgrey">Create Your Account ✨</font></p>

    <hr width="50%" color="white">

    <br><br>

    <form action="login.html">

        <font color="white">Full Name</font><br>
        <input type="text" size="30" required>

        <br><br>

        <font color="white">Email</font><br>
        <input type="email" size="30" required>

        <br><br>

        <font color="white">Phone Number</font><br>
        <input type="tel" size="30" required>

        <br><br>

        <font color="white">Password</font><br>
        <input type="password" size="30" required>

        <br><br>

        <font color="white">Confirm Password</font><br>
        <input type="password" size="30" required>

        <br><br><br>

        <input type="submit" value="REGISTER">

    </form>

    <br><br>

    <p>
        <font color="grey">
            Already have an account?

            <a href="login.html">
                <font color="lightgreen">Login</font>
            </a>
        </font>
    </p>

    <br>

    <hr width="50%" color="white">

    <h4><font color="grey">© 2026 Outfit Planner</font></h4>

</center>

</body>
</html>
